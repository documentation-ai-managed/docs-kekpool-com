openapi: '3.0.0'
info:
  version: 1.0.0
  title: kekpool.com API
  license:
    name: MIT
servers:
  - url: http://petstore.swagger.io/v1
paths:
  /miners:
    get:
      summary: List all miners
      operationId: listMiners
      parameters:
        - name: limit
          in: query
          description: How many items to return at one time (max 100)
          required: false
          schema:
            type: integer
            format: int32
      responses:
        200:
          description: An paged array of miners
          headers:
            x-next:
              description: A link to the next page of responses
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Miners'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Register miner
      operationId: createMiner
      responses:
        201:
          description: Null response
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /miners/{minerId}:
    get:
      summary: Miner details
      operationId: showMinerById
      parameters:
        - name: minerId
          in: path
          required: true
          description: The id of the miner to retrieve
          schema:
            type: string
      responses:
        200:
          description: Expected response to a valid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Miners'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /pools:
    get:
      summary: List all pools
      operationId: listPools
      parameters:
        - name: limit
          in: query
          description: How many items to return at one time (max 100)
          required: false
          schema:
            type: integer
            format: int32
      responses:
        200:
          description: An paged array of pools
          headers:
            x-next:
              description: A link to the next page of responses
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pools'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Miner:
      required:
        - id
        - address
      properties:
        id:
          type: integer
          format: int64
        address:
          type: string
        hashrate:
          type: integer
          format: int32
    Miners:
      type: array
      items:
        $ref: '#/components/schemas/Miner'
    Pool:
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        totalHashrate:
          type: integer
          format: int32
    Pools:
      type: array
      items:
        $ref: '#/components/schemas/Pool'
    Error:
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string